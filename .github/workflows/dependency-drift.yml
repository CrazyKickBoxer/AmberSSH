name: Dependency drift

# Pinning the vcpkg baseline fixed reproducibility and created staleness.
# This is the other half: once a month, say whether the crypto this project
# builds against has moved upstream. It changes nothing and opens nothing —
# moving a baseline is a decision that ends in a rebuild and a test run.
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Full history: the check reads versions/baseline.json at two commits,
      # and a shallow clone has neither.
      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          echo "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Compare pinned baseline with upstream
        shell: pwsh
        run: .\tools\check-deps.ps1
